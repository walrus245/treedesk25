<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkVault</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Inter Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 400: '#818cf8',
              500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #090d16; font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 30px -10px rgba(79, 70, 229, 0.25);
    }
    .link-hover { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    /* Prevent icons from intercepting button clicks */
    button i, a i { pointer-events: none; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white relative overflow-x-hidden">

  <!-- Ambient Glow Background -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-tr from-brand-600/30 to-purple-600/20 blur-[120px] rounded-full"></div>
  </div>

  <!-- Header Banner -->
  <main class="w-full max-w-md mx-auto px-4 py-10 flex-grow flex flex-col items-center relative z-10">
    <div class="w-full text-center mb-8">
      <div class="inline-flex items-center justify-center p-3 mb-3 bg-brand-600/10 border border-brand-500/20 rounded-2xl text-brand-400 shadow-lg">
        <i class="fa-solid fa-vault text-2xl"></i>
      </div>
      <h1 class="text-4xl font-black tracking-tight text-white mb-2">Link<span class="bg-gradient-to-r from-brand-400 to-purple-400 bg-clip-text text-transparent">Vault</span></h1>
      <p class="text-xs text-slate-400 font-medium tracking-wide">Curated hub of quick links & useful tools</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="w-full grid grid-cols-2 p-1.5 bg-slate-900/90 border border-slate-800/80 rounded-2xl mb-6 text-sm font-semibold backdrop-blur-md">
      <button id="tabLinksBtn" type="button" class="py-2.5 rounded-xl transition text-white bg-gradient-to-r from-brand-600 to-indigo-600 shadow-md flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-link text-xs"></i> Links
      </button>
      <button id="tabToolsBtn" type="button" class="py-2.5 rounded-xl transition text-slate-400 hover:text-white flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-screwdriver-wrench text-xs"></i> Tools
      </button>
    </div>

    <!-- Admin Control Bar -->
    <div id="adminBanner" class="hidden w-full mb-6 p-3.5 bg-brand-950/60 border border-brand-500/40 rounded-2xl flex items-center justify-between text-xs text-brand-300 shadow-lg backdrop-blur-md">
      <span class="flex items-center gap-2 font-medium">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="font-semibold text-emerald-400">Admin Mode</span>
      </span>
      <div class="flex items-center gap-1.5">
        <button id="openAddModalBtn" type="button" class="bg-brand-600 hover:bg-brand-500 text-white px-2.5 py-1.5 rounded-xl font-semibold text-xs transition shadow-md flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-plus text-[10px]"></i> Add
        </button>
        <button id="exportJsonBtn" type="button" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-xl font-semibold text-xs transition shadow-md flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-download text-[10px]"></i> Export JSON
        </button>
        <button id="logoutBtn" type="button" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-xl text-xs font-medium transition cursor-pointer">
          Exit
        </button>
      </div>
    </div>

    <!-- Container -->
    <div id="linksContainer" class="w-full space-y-3.5"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12 px-4 border border-dashed border-slate-800/80 rounded-3xl w-full bg-slate-900/30 backdrop-blur-sm">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-900 flex items-center justify-center text-slate-500 mb-3 border border-slate-800 shadow-inner">
        <i class="fa-solid fa-folder-open text-2xl"></i>
      </div>
      <p id="emptyStateText" class="text-sm font-semibold text-slate-300 mb-1">No items found.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-6 border-t border-slate-900/80 text-center relative z-10">
    <button id="openAuthModalBtn" type="button" class="inline-flex items-center gap-2 text-xs text-slate-400 hover:text-brand-300 transition cursor-pointer px-4 py-2 rounded-xl bg-slate-900/70 border border-slate-800/80">
      <i class="fa-solid fa-shield-halved text-brand-400 text-xs"></i>
      <span id="authBtnLabel" class="font-medium">Admin Unlock</span>
    </button>
  </footer>

  <!-- Admin Passcode Modal -->
  <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl relative">
      <button id="closeAuthModalBtn" type="button" class="absolute top-4 right-4 text-slate-500 hover:text-white text-sm p-2 cursor-pointer">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-brand-600/10 border border-brand-500/20 text-brand-400 flex items-center justify-center mx-auto mb-3 text-lg shadow-lg">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="text-xl font-bold text-white">Unlock Admin</h3>
      </div>
      <form id="authForm" class="space-y-4" onsubmit="return false;">
        <input type="password" id="adminPasscode" required placeholder="Enter passcode"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-brand-500 text-center font-mono tracking-widest">
        <p id="authError" class="text-red-400 text-xs text-center hidden font-medium"></p>
        <button id="authSubmitBtn" type="button" class="w-full py-3 bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-semibold rounded-xl text-sm transition cursor-pointer">
          Unlock Admin
        </button>
      </form>
    </div>
  </div>

  <!-- Add/Edit Item Modal -->
  <div id="linkModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl relative">
      <button id="closeLinkModalBtn" type="button" class="absolute top-4 right-4 text-slate-500 hover:text-white text-sm p-2 cursor-pointer">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 id="linkModalTitle" class="text-xl font-bold text-white mb-4">Add New Item</h3>
      <form id="linkForm" class="space-y-4" onsubmit="return false;">
        <input type="hidden" id="linkId">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Category Tab</label>
          <select id="linkCategory" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm cursor-pointer">
            <option value="links">Links</option>
            <option value="tools">Tools</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Title</label>
          <input type="text" id="linkTitle" required placeholder="e.g. Google" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">URL</label>
          <input type="text" id="linkUrl" required placeholder="example.com" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Icon Class</label>
          <input type="text" id="linkIcon" placeholder="fa-solid fa-globe" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm font-mono text-xs">
        </div>
        <button id="saveItemBtn" type="button" class="w-full py-3 bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-semibold rounded-xl text-sm transition cursor-pointer">
          Save Item
        </button>
      </form>
    </div>
  </div>

  <script>
    (function() {
      const RAW_GITHUB_JSON_URL = 'https://raw.githubusercontent.com/walrus245/treedesk25/main/links.json';
      const LOCAL_KEY = 'linkvault_items_data';

      let isAdmin = false;
      let currentTab = 'links';
      let allItems = [
        { id: '1', category: 'links', title: 'Google', url: 'https://google.com', icon: 'fa-solid fa-magnifying-glass' },
        { id: '2', category: 'tools', title: 'GitHub Repo', url: 'https://github.com/walrus245/treedesk25', icon: 'fa-brands fa-github' }
      ];

      function init() {
        // Direct event bindings with inline function handlers
        document.getElementById('tabLinksBtn').onclick = function() { switchTab('links'); };
        document.getElementById('tabToolsBtn').onclick = function() { switchTab('tools'); };

        document.getElementById('openAuthModalBtn').onclick = function() {
          if (!isAdmin) document.getElementById('authModal').classList.remove('hidden');
        };
        document.getElementById('closeAuthModalBtn').onclick = function() {
          document.getElementById('authModal').classList.add('hidden');
        };
        document.getElementById('authSubmitBtn').onclick = handleAuth;
        document.getElementById('adminPasscode').onkeyup = function(e) {
          if (e.key === 'Enter') handleAuth();
        };

        document.getElementById('logoutBtn').onclick = function() {
          isAdmin = false;
          document.getElementById('adminBanner').classList.add('hidden');
          document.getElementById('authBtnLabel').textContent = 'Admin Unlock';
          renderItems();
        };

        document.getElementById('openAddModalBtn').onclick = function() {
          document.getElementById('linkModalTitle').textContent = 'Add New Item';
          document.getElementById('linkId').value = '';
          document.getElementById('linkTitle').value = '';
          document.getElementById('linkUrl').value = '';
          document.getElementById('linkIcon').value = '';
          document.getElementById('linkCategory').value = currentTab;
          document.getElementById('linkModal').classList.remove('hidden');
        };

        document.getElementById('closeLinkModalBtn').onclick = function() {
          document.getElementById('linkModal').classList.add('hidden');
        };

        document.getElementById('saveItemBtn').onclick = handleSaveItem;

        document.getElementById('exportJsonBtn').onclick = function() {
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allItems, null, 2));
          const downloadAnchor = document.createElement('a');
          downloadAnchor.setAttribute("href", dataStr);
          downloadAnchor.setAttribute("download", "links.json");
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();
        };

        // Render starter items immediately
        renderItems();

        // Fetch live GitHub JSON
        fetchLiveLinks();
      }

      function handleAuth() {
        const pass = document.getElementById('adminPasscode').value.trim();
        const errorEl = document.getElementById('authError');
        if (pass === 'password123') {
          isAdmin = true;
          document.getElementById('authModal').classList.add('hidden');
          document.getElementById('adminBanner').classList.remove('hidden');
          document.getElementById('authBtnLabel').textContent = 'Admin Unlocked';
          errorEl.classList.add('hidden');
          document.getElementById('adminPasscode').value = '';
          renderItems();
        } else {
          errorEl.textContent = 'Incorrect passcode.';
          errorEl.classList.remove('hidden');
        }
      }

      function switchTab(tab) {
        currentTab = tab;
        const activeClass = 'py-2.5 rounded-xl transition text-white bg-gradient-to-r from-brand-600 to-indigo-600 shadow-md flex items-center justify-center gap-2 cursor-pointer';
        const inactiveClass = 'py-2.5 rounded-xl transition text-slate-400 hover:text-white flex items-center justify-center gap-2 cursor-pointer';

        document.getElementById('tabLinksBtn').className = tab === 'links' ? activeClass : inactiveClass;
        document.getElementById('tabToolsBtn').className = tab === 'tools' ? activeClass : inactiveClass;
        renderItems();
      }

      async function fetchLiveLinks() {
        try {
          const res = await fetch(`${RAW_GITHUB_JSON_URL}?t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              allItems = data;
              localStorage.setItem(LOCAL_KEY, JSON.stringify(allItems));
              renderItems();
            }
          }
        } catch (e) {
          const saved = localStorage.getItem(LOCAL_KEY);
          if (saved) {
            try { allItems = JSON.parse(saved); renderItems(); } catch (err) {}
          }
        }
      }

      function saveItems() {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(allItems));
        renderItems();
      }

      function renderItems() {
        const container = document.getElementById('linksContainer');
        const emptyState = document.getElementById('emptyState');
        const emptyStateText = document.getElementById('emptyStateText');

        container.innerHTML = '';
        const filtered = allItems.filter(item => (item.category || 'links') === currentTab);

        if (filtered.length === 0) {
          emptyStateText.textContent = `No ${currentTab} created yet.`;
          emptyState.classList.remove('hidden');
          return;
        }
        emptyState.classList.add('hidden');

        filtered.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = 'group relative flex items-center w-full';

          const defaultIcon = currentTab === 'tools' ? 'fa-solid fa-wrench' : 'fa-solid fa-arrow-up-right-from-square';
          const iconClass = item.icon && item.icon.trim() !== '' ? item.icon : defaultIcon;

          itemEl.innerHTML = `
            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" 
               class="glass-card link-hover flex items-center justify-between w-full px-5 py-4 rounded-2xl text-slate-100 font-medium shadow-md">
              <div class="flex items-center gap-3.5 truncate pr-16">
                <div class="w-8 h-8 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-400 shrink-0">
                  <i class="${iconClass} text-sm"></i>
                </div>
                <span class="truncate text-sm font-semibold">${escapeHtml(item.title)}</span>
              </div>
              <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-brand-400 group-hover:translate-x-1 transition-all"></i>
            </a>
          `;

          if (isAdmin) {
            const adminControls = document.createElement('div');
            adminControls.className = 'absolute right-3 flex items-center gap-1 bg-slate-950/90 p-1 rounded-xl border border-slate-800 shadow-xl z-10';

            const editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'p-1.5 text-slate-400 hover:text-brand-400 text-xs transition cursor-pointer';
            editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
            editBtn.onclick = function() { editItem(item.id); };

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'p-1.5 text-slate-400 hover:text-red-400 text-xs transition cursor-pointer';
            deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
            deleteBtn.onclick = function() { deleteItem(item.id); };

            adminControls.appendChild(editBtn);
            adminControls.appendChild(deleteBtn);
            itemEl.appendChild(adminControls);
          }

          container.appendChild(itemEl);
        });
      }

      function handleSaveItem() {
        if (!isAdmin) return;
        const id = document.getElementById('linkId').value;
        const category = document.getElementById('linkCategory').value || currentTab;
        const title = document.getElementById('linkTitle').value.trim();
        let url = document.getElementById('linkUrl').value.trim();
        const icon = document.getElementById('linkIcon').value.trim();

        if (!title || !url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        if (id) {
          const idx = allItems.findIndex(i => i.id === id);
          if (idx !== -1) allItems[idx] = { id, category, title, url, icon };
        } else {
          allItems.unshift({ id: 'item-' + Date.now(), category, title, url, icon });
        }

        saveItems();
        document.getElementById('linkModal').classList.add('hidden');
      }

      function editItem(id) {
        const item = allItems.find(i => i.id === id);
        if (!item) return;

        document.getElementById('linkModalTitle').textContent = 'Edit Item';
        document.getElementById('linkId').value = item.id;
        document.getElementById('linkCategory').value = item.category || 'links';
        document.getElementById('linkTitle').value = item.title;
        document.getElementById('linkUrl').value = item.url;
        document.getElementById('linkIcon').value = item.icon || '';
        document.getElementById('linkModal').classList.remove('hidden');
      }

      function deleteItem(id) {
        if (!isAdmin) return;
        allItems = allItems.filter(i => i.id !== id);
        saveItems();
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
